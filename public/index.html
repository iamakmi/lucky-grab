<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060f" />
<title>LUCKY GRAB · 럭키드로우</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/display.css" />
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <canvas id="fx"></canvas>

  <div class="vignette"></div>

  <div class="hud">
    <div class="brand">
      <div class="brand-kicker">QR LUCKY DRAW</div>
      <div class="brand-sub" id="brandSub">스마트폰으로 조작하는 럭키드로우</div>
    </div>

    <div class="status" id="statusChip">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">서버에 연결하는 중…</span>
      <span class="queue" id="queueText"></span>
    </div>

    <aside class="qr-panel" id="qrPanel">
      <div class="qr-head">📱 스마트폰으로 조작하기</div>
      <div class="qr-box"><div id="qrCode"></div></div>
      <div class="qr-url" id="qrUrl">주소를 불러오는 중…</div>
      <div class="qr-hint">
        휴대폰 <b>카메라</b>로 QR을 비추면 바로 열려요.<br />
        PC와 <b>같은 와이파이</b>에 연결되어 있어야 합니다.
      </div>
    </aside>

    <div class="prize-bar">
      <div class="prize-label">🎁 남은 경품</div>
      <div class="prize-list" id="prizeList"></div>
    </div>

    <div class="keyboard-hint" id="kbHint">
      <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> 이동 <span>·</span> <kbd>SPACE</kbd> 뽑기
    </div>

    <div class="corner-tools">
      <button id="soundBtn" class="icon-btn" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔈</button>
      <button id="fullBtn" class="icon-btn" type="button" title="전체 화면" aria-label="전체 화면">⛶</button>
    </div>
  </div>

  <div class="banner" id="banner">
    <div class="banner-glow" id="bannerGlow"></div>
    <div class="banner-card">
      <div class="banner-kicker" id="bannerKicker">당첨!</div>
      <div class="banner-prize" id="bannerPrize">경품 이름</div>
      <div class="banner-player" id="bannerPlayer"></div>
    </div>
  </div>
</div>

<script src="/vendor/qrcode.js"></script>
<script src="/js/display.js"></script>
</body>
</html>
